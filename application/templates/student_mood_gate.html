<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Mood Check | EqWell</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />
  <style id="card-wrap-guard">
    :is(article, [class*='rounded-2xl'], [class*='rounded-3xl'], .kpi-card, .panel-card, .soft-card, .deep-card, .analytics-subcard, .wellbeing-card, .chart-card) { min-width: 0; }
    :is(article, [class*='rounded-2xl'], [class*='rounded-3xl'], .kpi-card, .panel-card, .soft-card, .deep-card, .analytics-subcard, .wellbeing-card, .chart-card) :is(p, h1, h2, h3, h4, h5, h6, span, a, li, strong, small) { overflow-wrap: anywhere; word-break: break-word; }
  </style>
</head>
<body class="mood-page">
  <section class="mood-slider-screen" id="mood-screen">
    <div class="mood-slider-shell">
      <form method="post" action="{{ url_for('student_mood') }}" class="mood-slider-form" id="mood-form">
        <input type="hidden" name="mood" id="selected-mood" value="{{ selected_mood or '' }}" />

        <p class="mood-kicker">Student mood check-in</p>
        <h2 class="mood-question" id="mood-question">How are you feeling today?</h2>
        <p class="mood-sub">This step is required before the facial check and dashboard.</p>

        <div class="mood-face-wrap">
          <div class="mood-eyes">
            <div class="mood-eye" id="eye-left"></div>
            <div class="mood-eye" id="eye-right"></div>
          </div>
          <div class="mood-smile-wrap" id="smile-wrap">
            <svg viewBox="0 0 100 60" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path id="smile-path" d="M18 30 Q50 52 82 30" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </div>
        </div>

        <div class="mood-note-row">
          <h1 id="mood-note">SELECT MOOD</h1>
        </div>

        <div class="mood-slider-row">
          <div class="mood-track" id="mood-track"></div>
          <div class="mood-indicator" id="mood-indicator" aria-hidden="true" style="opacity: 0; visibility: hidden;">
            <svg viewBox="0 0 100 60" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path id="indicator-smile-path" d="M18 30 Q50 52 82 30" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </div>
          <div class="mood-dots" id="mood-dots"></div>
        </div>

        <div class="mood-label-row" id="mood-labels"></div>

        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for _, message in messages %}
              <p class="notice">{{ message }}</p>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <div class="mood-actions">
          <button class="btn-dark" type="submit" id="continue-btn" disabled>Continue</button>
        </div>
      </form>
    </div>
  </section>

  <script>
    const moodStates = [
      {
        key: "very-bad",
        label: "Very Bad",
        noteText: "VERY BAD",
        bgColor: "#fc7359",
        indicatorColor: "#790b02",
        pathColor: "#fc7359",
        smileColor: "#790b02",
        titleColor: "#790b02",
        trackColor: "#fc5b3e",
        eyeWidth: 52,
        eyeHeight: 52,
        eyeBorderRadius: "100%",
        eyeBg: "#790b02",
        smileRotate: 180,
        indicatorRotate: 180
      },
      {
        key: "bad",
        label: "Bad",
        noteText: "BAD",
        bgColor: "#f49e6c",
        indicatorColor: "#69300b",
        pathColor: "#f49e6c",
        smileColor: "#69300b",
        titleColor: "#69300b",
        trackColor: "#d47b3f",
        eyeWidth: 82,
        eyeHeight: 22,
        eyeBorderRadius: "36px",
        eyeBg: "#69300b",
        smileRotate: 180,
        indicatorRotate: 180
      },
      {
        key: "not-bad",
        label: "Not Bad",
        noteText: "NOT BAD",
        bgColor: "#dfa342",
        indicatorColor: "#482103",
        pathColor: "#dfa342",
        smileColor: "#482103",
        titleColor: "#482103",
        trackColor: "#b07615",
        eyeWidth: 100,
        eyeHeight: 20,
        eyeBorderRadius: "36px",
        eyeBg: "#482103",
        smileRotate: 180,
        indicatorRotate: 180
      },
      {
        key: "good",
        label: "Good",
        noteText: "GOOD",
        bgColor: "#9fbe59",
        indicatorColor: "#0b2b03",
        pathColor: "#9fbe59",
        smileColor: "#0b2b03",
        titleColor: "#0b2b03",
        trackColor: "#698b1b",
        eyeWidth: 118,
        eyeHeight: 118,
        eyeBorderRadius: "100%",
        eyeBg: "#0b2b03",
        smileRotate: 0,
        indicatorRotate: 0
      },
      {
        key: "very-good",
        label: "Very Good",
        noteText: "VERY GOOD",
        bgColor: "#79cb6a",
        indicatorColor: "#0d3505",
        pathColor: "#79cb6a",
        smileColor: "#0d3505",
        titleColor: "#0d3505",
        trackColor: "#44a031",
        eyeWidth: 126,
        eyeHeight: 126,
        eyeBorderRadius: "100%",
        eyeBg: "#0d3505",
        smileRotate: 0,
        indicatorRotate: 0
      }
    ];

    const selectedMoodInput = document.getElementById("selected-mood");
    const continueBtn = document.getElementById("continue-btn");
    const moodScreen = document.getElementById("mood-screen");
    const moodQuestion = document.getElementById("mood-question");
    const moodNote = document.getElementById("mood-note");
    const eyeLeft = document.getElementById("eye-left");
    const eyeRight = document.getElementById("eye-right");
    const smileWrap = document.getElementById("smile-wrap");
    const smilePath = document.getElementById("smile-path");
    const indicatorSmilePath = document.getElementById("indicator-smile-path");
    const moodTrack = document.getElementById("mood-track");
    const moodIndicator = document.getElementById("mood-indicator");
    const moodDots = document.getElementById("mood-dots");
    const moodLabels = document.getElementById("mood-labels");

    let selectedIndex = -1;
    const defaultIndicatorIndex = Math.floor(moodStates.length / 2);

    function setIndicatorVisible(visible) {
      moodIndicator.style.opacity = visible ? "1" : "0";
      moodIndicator.style.visibility = visible ? "visible" : "hidden";
      moodIndicator.setAttribute("aria-hidden", visible ? "false" : "true");
    }

    function alignIndicatorToCurrentOrDefault() {
      if (selectedIndex >= 0) {
        alignIndicatorToDot(selectedIndex);
      } else {
        alignIndicatorToDot(defaultIndicatorIndex);
      }
    }

    function alignTrackToDots() {
      const dots = Array.from(moodDots.children);
      if (dots.length < 2) return;

      const first = dots[0];
      const last = dots[dots.length - 1];
      const rowRect = moodDots.getBoundingClientRect();
      const firstCenter = first.offsetLeft + first.offsetWidth / 2;
      const lastCenter = last.offsetLeft + last.offsetWidth / 2;

      moodTrack.style.left = firstCenter + "px";
      moodTrack.style.right = Math.max(rowRect.width - lastCenter, 0) + "px";
    }

    function alignIndicatorToDot(index) {
      const dot = moodDots.children[index];
      if (!dot) return;
      const center = dot.offsetLeft + dot.offsetWidth / 2;
      moodIndicator.style.left = center + "px";
    }

    function applyState(index) {
      const state = moodStates[index];
      if (!state) return;

      selectedIndex = index;
      selectedMoodInput.value = state.key;
      continueBtn.disabled = false;

      moodScreen.style.backgroundColor = state.bgColor;
      moodQuestion.style.color = state.titleColor;
      moodNote.style.color = state.titleColor;
      moodNote.textContent = state.noteText;

      eyeLeft.style.width = state.eyeWidth + "px";
      eyeLeft.style.height = state.eyeHeight + "px";
      eyeLeft.style.borderRadius = state.eyeBorderRadius;
      eyeLeft.style.backgroundColor = state.eyeBg;

      eyeRight.style.width = state.eyeWidth + "px";
      eyeRight.style.height = state.eyeHeight + "px";
      eyeRight.style.borderRadius = state.eyeBorderRadius;
      eyeRight.style.backgroundColor = state.eyeBg;

      smileWrap.style.transform = "rotate(" + state.smileRotate + "deg)";
      smilePath.style.stroke = state.smileColor;

      moodTrack.style.backgroundColor = state.trackColor;
      indicatorSmilePath.style.stroke = state.pathColor;
      moodIndicator.style.backgroundColor = state.indicatorColor;
      moodIndicator.style.transform = "translate(-50%, -50%) rotate(" + state.indicatorRotate + "deg)";
      setIndicatorVisible(true);

      alignIndicatorToDot(index);

      Array.from(moodDots.children).forEach((btn, i) => {
        btn.style.backgroundColor = state.trackColor;
        btn.classList.toggle("active", i === index);
      });

      Array.from(moodLabels.children).forEach((label, i) => {
        label.style.color = state.titleColor;
        label.style.opacity = i === index ? "1" : "0.6";
        label.style.fontWeight = i === index ? "800" : "600";
      });
    }

    function buildControls() {
      moodStates.forEach((state, index) => {
        const dotBtn = document.createElement("button");
        dotBtn.type = "button";
        dotBtn.className = "mood-dot";
        dotBtn.setAttribute("aria-label", state.label);
        dotBtn.addEventListener("click", () => applyState(index));
        moodDots.appendChild(dotBtn);

        const label = document.createElement("span");
        label.className = "mood-label-item";
        label.textContent = state.label;
        moodLabels.appendChild(label);
      });
    }

    buildControls();

    const preSelected = moodStates.findIndex((s) => s.key === selectedMoodInput.value);
    if (preSelected >= 0) {
      applyState(preSelected);
    } else {
      setIndicatorVisible(false);
    }

    function syncInitialPositions() {
      alignTrackToDots();
      alignIndicatorToCurrentOrDefault();
    }

    // Run multiple times during first paint because external CSS/font timing can shift dot layout.
    requestAnimationFrame(syncInitialPositions);
    setTimeout(syncInitialPositions, 80);
    window.addEventListener("load", syncInitialPositions);

    window.addEventListener("resize", () => {
      syncInitialPositions();
    });
  </script>
</body>
</html>
