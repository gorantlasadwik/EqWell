<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>EqWell Desktop Only</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f0e8;
      --ink: #1a2438;
      --muted: #5b6678;
      --card: #ffffff;
      --border: rgba(26, 36, 56, 0.16);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      font-family: "Segoe UI", system-ui, sans-serif;
      background:
        radial-gradient(circle at 12% 0%, rgba(18, 63, 138, 0.14), transparent 36%),
        radial-gradient(circle at 90% 100%, rgba(202, 107, 67, 0.14), transparent 34%),
        linear-gradient(145deg, #f9f6f0 0%, #ebf1fb 100%);
      color: var(--ink);
    }

    .wrap {
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 20px;
    }

    .card {
      width: min(520px, 100%);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 22px;
      box-shadow: 0 18px 40px rgba(15, 26, 42, 0.14);
    }

    h1 {
      margin: 0;
      font-size: 28px;
      line-height: 1.1;
    }

    p {
      margin: 12px 0 0;
      color: var(--muted);
      line-height: 1.6;
      font-size: 15px;
    }

    .meta {
      margin-top: 12px;
      font-size: 13px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="card" role="status" aria-live="polite">
      <h1>Open EqWell on Desktop</h1>
      <p>
        This portal is available only in desktop view right now. Please open this link from a laptop or PC browser.
      </p>
      {% if requested_template %}
      <p class="meta">Requested page: {{ requested_template }}</p>
      {% endif %}
    </section>
  </main>
</body>
</html>
