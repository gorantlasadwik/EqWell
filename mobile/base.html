<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ page_title }} | EqWell</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />
  <style id="card-wrap-guard">
    :is(article, [class*='rounded-2xl'], [class*='rounded-3xl'], .kpi-card, .panel-card, .soft-card, .deep-card, .analytics-subcard, .wellbeing-card, .chart-card) { min-width: 0; }
    :is(article, [class*='rounded-2xl'], [class*='rounded-3xl'], .kpi-card, .panel-card, .soft-card, .deep-card, .analytics-subcard, .wellbeing-card, .chart-card) :is(p, h1, h2, h3, h4, h5, h6, span, a, li, strong, small) { overflow-wrap: anywhere; word-break: break-word; }
  </style>
  
  <link rel="stylesheet" href="/mobile-overrides.css" />
</head>
<body class="mobile-new-page">
  <div class="mobile-new-frame">
    <header class="mobile-new-header">
      <button type="button" class="mobile-new-icon-btn" data-mobile-open aria-label="Open menu">
        <span class="material-symbols-outlined">menu</span>
      </button>
      <div class="mobile-new-brand">
        <strong>EqWell</strong>
        <span>Mobile Console</span>
      </div>
      <button type="button" class="mobile-new-icon-btn" aria-label="Notifications">
        <span class="material-symbols-outlined">notifications</span>
      </button>
    </header>

    <aside class="mobile-new-drawer" data-mobile-drawer aria-hidden="true">
      <div class="mobile-new-drawer-head">
        <strong>Navigation</strong>
        <button type="button" class="mobile-new-icon-btn" data-mobile-close aria-label="Close menu">
          <span class="material-symbols-outlined">close</span>
        </button>
      </div>
      <div class="mobile-new-drawer-body">
<nav class="mobile-new-nav-links">
  <a href="{{ url_for('home') }}"><span class="material-symbols-outlined">home</span>Home</a>
  <a href="{{ url_for('login') }}"><span class="material-symbols-outlined">login</span>Login</a>
  <a href="{{ url_for('signup_showcase') }}"><span class="material-symbols-outlined">person_add</span>Sign up</a>
  <a href="{{ url_for('install_extension') }}"><span class="material-symbols-outlined">extension</span>Extension</a>
</nav>
      </div>
    </aside>

    <button type="button" class="mobile-new-backdrop" data-mobile-close aria-label="Close navigation"></button>

    <main class="mobile-new-main">
<div class="privacy-strip">
        <span class="material-symbols-outlined" style="font-size: 18px;">lock</span>
        We do not track students. We track wellbeing signals.
      </div>

      <header class="topbar">
        <div>
          <h1 class="title">{{ page_title }}</h1>
          <p class="subtitle">{{ page_subtitle }}</p>
        </div>
        <div class="top-controls">
          <span class="role-chip">{{ active_role | capitalize }} portal</span>
          <form class="logout-form" method="post" action="{{ url_for('logout') }}">
            <button class="logout-btn" type="submit">Logout</button>
          </form>
        </div>
      </header>

      <section class="content">
        {% block content %}{% endblock %}
      </section>
    </main>
  </div>

  <script id="eqwell-extension-bootstrap" type="application/json">{{ extension_bootstrap_payload | tojson }}</script>
  <script defer src="/mobile-drawer.js"></script>
</body>
</html>
