{% extends "mobile/_layout.html" %}
{% set page_title = "Parent Alerts" %}
{% block content %}
<section class="mq-grid">
  <article class="mq-card">
    <h2>Parent Alerts</h2>
    <ul class="mq-list" style="margin-top: 8px;">
      {% for alert in parent_alerts|default([]) %}
        <li class="mq-list-item"><p>{{ alert }}</p></li>
      {% else %}
        <li class="mq-list-item"><p>No active alerts.</p></li>
      {% endfor %}
    </ul>
  </article>
</section>
{% endblock %}
