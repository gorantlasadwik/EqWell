{% extends "mobile/_layout.html" %}
{% set page_title = "Mood Gate" %}
{% block content %}
<section class="mq-grid">
  <article class="mq-card">
    <h2>Daily Mood Gate</h2>
    <p>Select the mood that best matches your current state.</p>
    <form class="mq-form" method="post" action="{{ url_for('student_mood') }}" style="margin-top: 10px;">
      <div class="mq-list">
        {% for mood_key, mood in mood_options.items() %}
          <label class="mq-list-item" style="display:flex; align-items:center; gap:10px;">
            <input type="radio" name="mood" value="{{ mood_key }}" {% if selected_mood == mood_key %}checked{% endif %} required />
            <div>
              <h4>{{ mood.get('label', mood_key|replace('-', ' ')|title) }}</h4>
              <p>Score {{ mood.get('score', 3) }}/5</p>
            </div>
          </label>
        {% endfor %}
      </div>
      <button class="mq-btn" type="submit">Continue to Face Check</button>
    </form>
  </article>
</section>
{% endblock %}
