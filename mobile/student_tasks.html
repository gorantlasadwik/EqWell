{% extends "mobile/_layout.html" %}
{% set page_title = "Student Tasks" %}
{% block content %}
<section class="mq-grid">
  <article class="mq-card">
    <h2>Daily Tasks</h2>
    <p>Claim up to {{ task_daily_cap|default(20) }} points each day.</p>
    <div id="task-summary" class="mq-grid two" style="margin-top: 10px;">
      <div class="mq-metric"><small>Claimed</small><strong id="claimed-points">0</strong></div>
      <div class="mq-metric"><small>Remaining</small><strong id="remaining-points">0</strong></div>
    </div>
  </article>

  <article class="mq-card">
    <h3>Task List</h3>
    <ul id="task-list" class="mq-list" style="margin-top: 10px;"></ul>
  </article>
</section>
{% endblock %}
{% block scripts %}
<script>
(function () {
  const list = document.getElementById('task-list');
  const claimed = document.getElementById('claimed-points');
  const remaining = document.getElementById('remaining-points');

  if (!list || !claimed || !remaining) return;

  const render = (data) => {
    claimed.textContent = String(data.claimed_points || 0);
    remaining.textContent = String(data.remaining_points || 0);

    const tasks = Array.isArray(data.tasks) ? data.tasks : [];
    if (!tasks.length) {
      list.innerHTML = '<li class="mq-list-item"><p>No tasks available right now.</p></li>';
      return;
    }

    list.innerHTML = tasks.map((task) => {
      const disabled = (!task.completed || task.claimed) ? 'disabled' : '';
      const buttonLabel = task.claimed ? 'Claimed' : (task.completed ? 'Claim' : 'Incomplete');
      return `
        <li class="mq-list-item">
          <h4>${task.title || 'Task'}</h4>
          <p>${task.note || ''}</p>
          <p>Points: ${task.points || 0}</p>
          <button class="mq-btn-ghost" data-task-id="${task.id || ''}" ${disabled}>${buttonLabel}</button>
        </li>
      `;
    }).join('');

    list.querySelectorAll('button[data-task-id]').forEach((btn) => {
      btn.addEventListener('click', async () => {
        const taskId = btn.getAttribute('data-task-id');
        if (!taskId || btn.disabled) return;
        btn.disabled = true;
        try {
          const res = await fetch('/api/student/tasks/claim', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ task_id: taskId })
          });
          const payload = await res.json();
          render(payload);
        } catch (err) {
          btn.disabled = false;
        }
      });
    });
  };

  fetch('/api/student/tasks/state')
    .then((res) => res.json())
    .then((payload) => render(payload))
    .catch(() => {
      list.innerHTML = '<li class="mq-list-item"><p>Unable to load tasks.</p></li>';
    });
})();
</script>
{% endblock %}
