{% extends "mobile/_layout.html" %}
{% set page_title = "Warden Alerts" %}
{% block content %}
<section class="mq-grid">
  <article class="mq-card">
    <h2>Warden Alerts</h2>
    <ul class="mq-list" style="margin-top: 10px;">
      {% for alert in warden_alerts|default([]) %}
        <li class="mq-list-item"><p>{{ alert }}</p></li>
      {% else %}
        <li class="mq-list-item"><p>No alerts available.</p></li>
      {% endfor %}
    </ul>
  </article>
</section>
{% endblock %}
