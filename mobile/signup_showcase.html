{% extends "mobile/_layout.html" %}
{% set page_title = "Signup" %}
{% block content %}
<section class="mq-grid">
  <article class="mq-card">
    <h2>Create Account Request</h2>
    <p>Submit your details for role approval.</p>
    <form class="mq-form" method="post" action="{{ url_for('signup_showcase') }}" style="margin-top: 10px;">
      <label class="mq-label">Full Name<input class="mq-input" type="text" name="name" required /></label>
      <label class="mq-label">Email<input class="mq-input" type="email" name="email" required /></label>
      <label class="mq-label">Password<input class="mq-input" type="password" name="password" minlength="6" required /></label>
      <label class="mq-label">Confirm Password<input class="mq-input" type="password" name="confirm_password" minlength="6" required /></label>
      <label class="mq-label">
        Role
        <select class="mq-select" name="role" required>
          {% for role_key, role_label in [('student','Student'),('warden','Warden'),('counsellor','Counsellor'),('developer','Developer'),('parent','Parent'),('proctor','Proctor')] %}
            <option value="{{ role_key }}" {% if selected_role == role_key %}selected{% endif %}>{{ role_label }}</option>
          {% endfor %}
        </select>
      </label>
      <label class="mq-label">Note
        <textarea class="mq-textarea" name="note" placeholder="Optional reason or context"></textarea>
      </label>
      <button class="mq-btn" type="submit">Submit Signup</button>
    </form>
  </article>
</section>
{% endblock %}
