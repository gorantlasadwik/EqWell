{% extends "mobile/_layout.html" %}
{% set page_title = "Login" %}
{% block content %}
<section class="mq-grid">
  <article class="mq-card">
    <h2>Sign In</h2>
    <p>Access your role console from this mobile portal.</p>
    <form class="mq-form" method="post" action="{{ url_for('login', role=initial_role) if lock_role else url_for('login') }}" style="margin-top: 10px;">
      <input type="hidden" id="extension-portal-nonce" name="extension_portal_nonce" value="{{ portal_extension_nonce | default('') }}" />
      <input type="hidden" id="extension-portal-proof" name="extension_portal_proof" value="" />

      <label class="mq-label">
        Role
        <select class="mq-select" name="role" {% if lock_role %}disabled{% endif %}>
          {% for role_key, role_label in [('student','Student Dashboard'),('warden','Warden Dashboard'),('counsellor','Counsellor Dashboard'),('developer','Developer Dashboard'),('parent','Parent Dashboard'),('proctor','Proctor Dashboard')] %}
            <option value="{{ role_key }}" {% if (initial_role|default('student')) == role_key %}selected{% endif %}>{{ role_label }}</option>
          {% endfor %}
        </select>
      </label>

      {% if lock_role %}
        <input type="hidden" name="role" value="{{ initial_role | default('student') }}" />
      {% endif %}

      <label class="mq-label">
        Email
        <input class="mq-input" type="email" name="email" placeholder="name@example.com" required />
      </label>

      <label class="mq-label">
        Password
        <input class="mq-input" type="password" name="password" placeholder="Enter password" required />
      </label>

      <button class="mq-btn" type="submit">Continue</button>
    </form>

    <div class="mq-pill-row">
      <a class="mq-pill" href="{{ url_for('install_extension') }}">Install Extension</a>
      <a class="mq-pill" href="{{ url_for('signup_showcase') }}">Need account?</a>
    </div>
  </article>
</section>
{% endblock %}
